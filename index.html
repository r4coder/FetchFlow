<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Project</title>
</head>
<body>
    <h1>Fetch API Project</h1>

    <h2>Fetch GET API</h2>
    <button id="getBtn">Get User</button>
    <p id="getOutput"></p>

    <h2>Fetch POST API</h2>
    <form id="postForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">Submit</button>
    </form>
    <p id="postOutput"></p>

    <script>
        const getBtn = document.getElementById('getBtn');
        const form = document.getElementById('postForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');

        // GET API
        getBtn.addEventListener('click', async function () {
            try {
                const res = await fetch(
                    'https://jsonplaceholder.typicode.com/posts/1'
                );

                if (!res.ok) {
                    throw new Error(`HTTP error: ${res.status}`);
                }

                const data = await res.json();

                document.getElementById('getOutput').innerText =
                    JSON.stringify(data, null, 2);

            } catch (error) {
                console.error('GET Error:', error);
                document.getElementById('getOutput').innerText =
                    'Failed to fetch data: ' + error.message;
            }
        });

        // POST API
        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const data = {
                name: nameInput.value,
                email: emailInput.value
            };

            try {
                const res = await fetch(
                    'https://jsonplaceholder.typicode.com/posts',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    }
                );

                if (!res.ok) {
                    throw new Error(`HTTP error: ${res.status}`);
                }

                const responseData = await res.json();

                document.getElementById('postOutput').innerText =
                    JSON.stringify(responseData, null, 2);

            } catch (error) {
                console.error('POST Error:', error);
                document.getElementById('postOutput').innerText =
                    'Failed to submit data: ' + error.message;
            }
        });
    </script>
</body>
</html>
